<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Zameen 3D</title>
  <meta name="description" content="Interactive 3D view of a 4-acre plot of land.">
  <meta name="theme-color" content="#b9d4e8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.min.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="view" aria-label="3D view of the land"></canvas>

  <div id="status" role="status">Loading…</div>

  <div id="hint">
    <span class="touch">1 ungli: ghumao · 2 ungliyan: zoom / khiskao<br>Cheez par tap karo, phir ungli se khiskao</span>
    <span class="mouse">Left drag: ghumao · Wheel: zoom · Right drag: khiskao<br>Cheez par click karo, phir drag karo</span>
  </div>

  <button id="reset" type="button" aria-label="Reset view" title="Reset view">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
  </button>

  <nav id="menu" aria-label="Objects">
    <div id="adds"></div>
    <button id="del" class="tool" type="button" disabled>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      <span>Delete</span>
    </button>
    <button id="reset-layout" class="tool" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      <span>Reset layout</span>
    </button>
  </nav>

  <script type="module" src="main.js"></script>
</body>
</html>
